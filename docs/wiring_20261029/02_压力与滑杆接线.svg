<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1510" viewBox="0 0 1700 1510" role="img"><title>V020 · ADS1115 / 两张 FSR602 / 两个滑杆</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2566ad"/></marker></defs><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><rect width="1700" height="1510" fill="#f1f5f9"/>
<text x="40" y="55" font-size="36" fill="#183448" font-weight="700" text-anchor="start">V020 · ADS1115 / 两张 FSR602 / 两个滑杆</text>
<text x="40" y="96" font-size="22" fill="#516579" font-weight="400" text-anchor="start">2026-10-29｜A0 明亮度 · A1 揉弦 · A2 音量 · A3 基础音高；外部模拟量均限制在 0～3.3V。</text>
<rect x="40" y="130" width="1620" height="220" rx="14" fill="#ffffff" stroke="#bfcedb" stroke-width="2"/>
<text x="65" y="170" font-size="28" fill="#183448" font-weight="700" text-anchor="start">ADS1115 模块丝印逐针连接</text>
<text x="70" y="221" font-size="25" fill="#183448" font-weight="400" text-anchor="start">VDD → 3V3</text>
<text x="580" y="221" font-size="25" fill="#183448" font-weight="400" text-anchor="start">GND → 公共 GND</text>
<text x="70" y="269" font-size="25" fill="#183448" font-weight="400" text-anchor="start">SCL → D14</text>
<text x="580" y="269" font-size="25" fill="#183448" font-weight="400" text-anchor="start">SDA → E15</text>
<text x="70" y="317" font-size="25" fill="#183448" font-weight="400" text-anchor="start">ADDR → GND</text>
<text x="580" y="317" font-size="25" fill="#183448" font-weight="400" text-anchor="start">ALRT → 留空</text>
<text x="1110" y="225" font-size="25" fill="#183448" font-weight="700" text-anchor="start">I²C 7 位地址：0x48</text>
<text x="1110" y="275" font-size="23" fill="#183448" font-weight="400" text-anchor="start">SCL / SDA 上拉到 3.3V</text>
<text x="1110" y="316" font-size="22" fill="#516579" font-weight="400" text-anchor="start">已有板载上拉时不重复强上拉</text>
<rect x="40" y="385" width="1620" height="285" rx="14" fill="#ffffff" stroke="#bfcedb" stroke-width="2"/>
<text x="65" y="429" font-size="28" fill="#183448" font-weight="700" text-anchor="start">FSR602 #1 → ADS1115 A0</text>
<text x="85" y="524" font-size="25" fill="#b73747" font-weight="700" text-anchor="start">3.3V</text>
<path d="M180 515H295" fill="none" stroke="#b73747" stroke-width="3"/>
<rect x="295" y="493" width="170" height="44" fill="#fff" stroke="#2566ad" stroke-width="3"/>
<text x="380" y="523" font-size="24" fill="#183448" font-weight="400" text-anchor="middle">FSR602</text>
<path d="M465 515H895" fill="none" stroke="#2566ad" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="610" cy="515" r="5" fill="#2566ad"/>
<text x="920" y="523" font-size="28" fill="#16609c" font-weight="700" text-anchor="start">ADS A0</text>
<path d="M610 515V554" fill="none" stroke="#2566ad" stroke-width="3"/>
<rect x="596" y="554" width="28" height="56" fill="#fff" stroke="#2566ad" stroke-width="3"/>
<path d="M610 610V631H820" fill="none" stroke="#596879" stroke-width="3"/>
<text x="650" y="590" font-size="24" fill="#183448" font-weight="400" text-anchor="start">10kΩ 下拉</text>
<text x="835" y="638" font-size="24" fill="#596879" font-weight="400" text-anchor="start">GND</text>
<text x="1090" y="493" font-size="23" fill="#183448" font-weight="400" text-anchor="start">按住琴键后，按压改变明亮度</text>
<text x="1090" y="539" font-size="22" fill="#183448" font-weight="400" text-anchor="start">FSR 是电阻，不直接输出电压。</text>
<text x="1090" y="580" font-size="22" fill="#183448" font-weight="400" text-anchor="start">两端无极性；一片用一只 10k。</text>
<text x="65" y="660" font-size="21" fill="#516579" font-weight="400" text-anchor="start">节点电压随压力增大而升高；如已有相同分压，保持原接法，无须叠加电阻。</text>
<rect x="40" y="700" width="1620" height="285" rx="14" fill="#ffffff" stroke="#bfcedb" stroke-width="2"/>
<text x="65" y="744" font-size="28" fill="#183448" font-weight="700" text-anchor="start">FSR602 #2 → ADS1115 A1</text>
<text x="85" y="839" font-size="25" fill="#b73747" font-weight="700" text-anchor="start">3.3V</text>
<path d="M180 830H295" fill="none" stroke="#b73747" stroke-width="3"/>
<rect x="295" y="808" width="170" height="44" fill="#fff" stroke="#2566ad" stroke-width="3"/>
<text x="380" y="838" font-size="24" fill="#183448" font-weight="400" text-anchor="middle">FSR602</text>
<path d="M465 830H895" fill="none" stroke="#2566ad" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="610" cy="830" r="5" fill="#2566ad"/>
<text x="920" y="838" font-size="28" fill="#16609c" font-weight="700" text-anchor="start">ADS A1</text>
<path d="M610 830V869" fill="none" stroke="#2566ad" stroke-width="3"/>
<rect x="596" y="869" width="28" height="56" fill="#fff" stroke="#2566ad" stroke-width="3"/>
<path d="M610 925V946H820" fill="none" stroke="#596879" stroke-width="3"/>
<text x="650" y="905" font-size="24" fill="#183448" font-weight="400" text-anchor="start">10kΩ 下拉</text>
<text x="835" y="953" font-size="24" fill="#596879" font-weight="400" text-anchor="start">GND</text>
<text x="1090" y="808" font-size="23" fill="#183448" font-weight="400" text-anchor="start">按住琴键后，按压改变揉弦深度</text>
<text x="1090" y="854" font-size="22" fill="#183448" font-weight="400" text-anchor="start">FSR 是电阻，不直接输出电压。</text>
<text x="1090" y="895" font-size="22" fill="#183448" font-weight="400" text-anchor="start">两端无极性；一片用一只 10k。</text>
<text x="65" y="975" font-size="21" fill="#516579" font-weight="400" text-anchor="start">节点电压随压力增大而升高；如已有相同分压，保持原接法，无须叠加电阻。</text>
<rect x="40" y="1030" width="795" height="290" rx="14" fill="#ffffff" stroke="#bfcedb" stroke-width="2"/>
<text x="65" y="1075" font-size="27" fill="#183448" font-weight="700" text-anchor="start">HW-233 滑杆 #1 → A2 / 音量</text>
<text x="85" y="1128" font-size="26" fill="#183448" font-weight="700" text-anchor="start">OTA</text>
<path d="M210 1121H450" fill="none" stroke="#2566ad" stroke-width="3" marker-end="url(#arrow)"/>
<text x="485" y="1128" font-size="26" fill="#2566ad" font-weight="400" text-anchor="start">A2</text>
<text x="85" y="1181" font-size="26" fill="#183448" font-weight="700" text-anchor="start">VCC</text>
<path d="M210 1174H450" fill="none" stroke="#b73747" stroke-width="3" marker-end="url(#arrow)"/>
<text x="485" y="1181" font-size="26" fill="#b73747" font-weight="400" text-anchor="start">3.3V</text>
<text x="85" y="1234" font-size="26" fill="#183448" font-weight="700" text-anchor="start">GND</text>
<path d="M210 1227H450" fill="none" stroke="#596879" stroke-width="3" marker-end="url(#arrow)"/>
<text x="485" y="1234" font-size="26" fill="#596879" font-weight="400" text-anchor="start">公共 GND</text>
<text x="65" y="1295" font-size="21" fill="#516579" font-weight="400" text-anchor="start">仅接 OTA 这一组 3 针；另一组 OTB / VCC / GND 留空。</text>
<rect x="865" y="1030" width="795" height="290" rx="14" fill="#ffffff" stroke="#bfcedb" stroke-width="2"/>
<text x="890" y="1075" font-size="27" fill="#183448" font-weight="700" text-anchor="start">HW-233 滑杆 #2 → A3 / 基础音高</text>
<text x="910" y="1128" font-size="26" fill="#183448" font-weight="700" text-anchor="start">OTA</text>
<path d="M1035 1121H1275" fill="none" stroke="#2566ad" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1310" y="1128" font-size="26" fill="#2566ad" font-weight="400" text-anchor="start">A3</text>
<text x="910" y="1181" font-size="26" fill="#183448" font-weight="700" text-anchor="start">VCC</text>
<path d="M1035 1174H1275" fill="none" stroke="#b73747" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1310" y="1181" font-size="26" fill="#b73747" font-weight="400" text-anchor="start">3.3V</text>
<text x="910" y="1234" font-size="26" fill="#183448" font-weight="700" text-anchor="start">GND</text>
<path d="M1035 1227H1275" fill="none" stroke="#596879" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1310" y="1234" font-size="26" fill="#596879" font-weight="400" text-anchor="start">公共 GND</text>
<text x="890" y="1295" font-size="21" fill="#516579" font-weight="400" text-anchor="start">仅接 OTA 这一组 3 针；另一组 OTB / VCC / GND 留空。</text>
<rect x="40" y="1345" width="1620" height="115" rx="14" fill="#fff4dd" stroke="#bfcedb" stroke-width="2"/>
<text x="65" y="1385" font-size="24" fill="#183448" font-weight="700" text-anchor="start">启动时两张压力片都松开约 1 秒，让程序学习静止基线；单独压 FSR 不会生成音符。</text>
<text x="65" y="1427" font-size="23" fill="#183448" font-weight="400" text-anchor="start">FSR #1 是混音后全局滤波表情，FSR #2 是旋律声部的全局揉弦；滑杆依然控制音量和基础音高。</text></g></svg>