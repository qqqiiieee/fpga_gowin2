<text x="65" y="1445" font-size="23" fill="#183448" font-weight="400" text-anchor="start">PMOD 3V3 → ADS VDD、两滑杆 VCC、GVS V、MCP 3.3V、BMV VDD、四个光电端的红线。</text>
<text x="65" y="1487" font-size="23" fill="#183448" font-weight="400" text-anchor="start">PMOD GND → 上述模块 G/GND、光电黑线、各分压下端。用配电排并联分支，不经 GPIO 供电。</text>
<text x="40" y="1570" font-size="22" fill="#516579" font-weight="400" text-anchor="start">继续看：02 模拟控制详图；03 MIDI / 光束详图；04 GVS / MCP 详图；HTML 附逐根线表和测试顺序。</text></g></svg>