<text x="65" y="1240" font-size="23" fill="#183448" font-weight="400" text-anchor="start">上方小表只复画丝印中的两列球号；板翻到正面后左右镜像，不能照着背面表盲插。</text>
<text x="65" y="1283" font-size="23" fill="#a54323" font-weight="400" text-anchor="start">PMOD1：R2 = M14，R3 = T12 是当前程序的修正映射，请保持；不要按物理第二、三行顺序改回。</text>
<rect x="40" y="1360" width="1620" height="170" rx="14" fill="#ffffff" stroke="#bfcedb" stroke-width="2"/>
